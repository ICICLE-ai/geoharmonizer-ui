name: Repository health

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required-project-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify contribution-readiness files
        run: |
          required_files=(
            "LICENSE"
            "README.md"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            "CITATION.cff"
            ".env.example"
            "docs/RELEASE_CHECKLIST.md"
            "docs/MAINTAINER_ROLES.md"
          )
          missing=0
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required project file: $file"
              missing=1
            fi
          done
          exit "$missing"

  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the node image the Dockerfile builds with.
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run lint

      # No VITE_* values are supplied here. The build must succeed on the
      # defaults alone, and passing real tenant values would bake them into a
      # CI artifact that nothing publishes.
      - run: npm run build

  env-example-documented:
    name: VITE_* variables are documented
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare source usage against .env.example
        run: |
          set -euo pipefail
          # Vite inlines these into the public bundle, so an undocumented one is
          # configuration a deployer has no way to discover.
          used=$(grep -rhoE 'import\.meta\.env\.VITE_[A-Z0-9_]+' src/ \
            | sed 's/.*env\.//' | sort -u)
          missing=0
          for name in $used; do
            if ! grep -qE "^#?\s*${name}=" .env.example; then
              echo "VITE_ variable used in src/ but not documented in .env.example: $name"
              missing=1
            fi
          done
          exit "$missing"
